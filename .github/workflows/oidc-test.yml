name: TTT-3170 OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: sts.amazonaws.com
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::550644673161:role/TTT3170-GitHubActions-Test
          aws-region: eu-west-2

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Create test file
        run: echo "TTT-3170 OIDC test successful" > test.txt

      - name: Upload to S3
        run: aws s3 cp test.txt s3://javid-ttt3170-oidc-test/test.txt
